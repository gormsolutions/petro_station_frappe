<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stock Report</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fdfdfd;
      padding: 40px;
      color: #333;
    }
    h2 {
      text-align: center;
      color: #c79810;
      margin-bottom: 10px;
    }
    .logo {
      width: 120px;
      float: left;
    }
    .controls {
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 40px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #ffd700;
      color: #000;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .footer {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .signature-line {
      border-top: 1px solid #aaa;
      width: 300px;
      text-align: center;
      padding-top: 5px;
    }
    .export-btn, .print-btn {
      background-color: #c79810;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <img src="/assets/petro_station_app/img/Shell-Logo.png" alt="Company Logo" class="logo" />
  <h2>STOCK AS <span id="report-date">--/--/----</span></h2>

  <div class="controls">
    <label for="as_of_date">As of Date:</label>
    <input type="date" id="as_of_date" />
    <button onclick="loadData()" class="export-btn">Generate</button>
    <button onclick="submitToERPNext()" class="export-btn">Submit to ERPNext</button>
    <button onclick="exportExcel()" class="export-btn">Export to Excel</button>
    <button onclick="window.print()" class="print-btn">Print</button>
  </div>

  <div id="report-container"></div>

  <div class="footer">
    <div class="signature-line">Prepared By</div>
    <div class="signature-line">Approved By</div>
  </div>

  <script>
    let reportData = {};  // Structure: { item_code: { warehouse: {system_qty, physical_qty, difference} } }

    async function loadData() {
      const date = document.getElementById('as_of_date').value;
      if (!date) {
        alert("Please select a date.");
        return;
      }
      document.getElementById('report-date').innerText = new Date(date).toLocaleDateString();

      const res = await axios.get("http://147.79.101.23/api/method/petro_station_app.custom_api.gas_invoice.stock_balances.get_qty_as_of_date", {
        params: { as_of_date: date }
      });

      const data = res.data.message;
      const warehouses = ['Jinja', 'Gulu', 'Mbale'];

      // Build table header
      let html = '<table><thead><tr><th>Item</th>';
      warehouses.forEach(w => {
        html += `<th>${w} System Qty</th><th>${w} Physical Qty</th><th>${w} Difference</th>`;
      });
      html += '</tr></thead><tbody>';

      reportData = {}; // reset

      // Data structure is: {item_type: { warehouse_name: [rows] } }
      Object.entries(data).forEach(([item_type, wh_data]) => {
        let grouped = {}; // {item_code: {Jinja: {...}, Gulu: {...}, Mbale: {...}}}

        warehouses.forEach(w => {
          // Find actual key matching warehouse ignoring case
          const wh_full = Object.keys(wh_data).find(k => k.toLowerCase().includes(w.toLowerCase()));
          if (wh_full && wh_data[wh_full]) {
            wh_data[wh_full].forEach(row => {
              if (!grouped[row.item_code]) grouped[row.item_code] = {};
              grouped[row.item_code][w] = {
                item_code: row.item_code,
                warehouse: w,
                system_qty: row.qty_after_transaction,
                physical_qty: 0,
                difference: row.qty_after_transaction
              };
            });
          }
        });

        html += `<tr><td colspan="${warehouses.length * 3 + 1}" style="text-align:left;font-weight:bold;padding-top:20px;">${item_type.toUpperCase()}</td></tr>`;

        Object.entries(grouped).forEach(([item_code, whs]) => {
          html += `<tr><td>${item_code}</td>`;
          if (!reportData[item_code]) reportData[item_code] = {};

          warehouses.forEach(w => {
            const q = whs[w] || {system_qty: 0, physical_qty: 0, difference: 0};
            reportData[item_code][w] = {
              item_code,
              warehouse: w,
              system_qty: q.system_qty,
              physical_qty: 0,
              difference: q.system_qty
            };

            const inputId = `${item_code}_${w}_phy`;
            const diffId = `${item_code}_${w}_diff`;

            html += `
              <td>${q.system_qty}</td>
              <td><input type="number" id="${inputId}" data-item="${item_code}" data-wh="${w}" min="0" value="0" oninput="updateDifference(this)" /></td>
              <td id="${diffId}">${q.system_qty}</td>
            `;
          });

          html += '</tr>';
        });
      });

      html += '</tbody></table>';
      document.getElementById('report-container').innerHTML = html;
    }

    function updateDifference(input) {
      const item = input.dataset.item;
      const wh = input.dataset.wh;
      const val = parseFloat(input.value) || 0;
      const sysQty = reportData[item][wh].system_qty;
      const diff = sysQty - val;

      reportData[item][wh].physical_qty = val;
      reportData[item][wh].difference = diff;

      document.getElementById(`${item}_${wh}_diff`).innerText = diff.toFixed(2);
    }

    async function submitToERPNext() {
      try {
        const as_of_date = document.getElementById('as_of_date').value;
        if (!as_of_date) {
          alert("Please select the As of Date before submitting.");
          return;
        }

        // Find first warehouse with physical_qty > 0 to assign as store
        let store = null;
        outerLoop:
        for (const [item_code, warehouses] of Object.entries(reportData)) {
          for (const [wh, details] of Object.entries(warehouses)) {
            if (details.physical_qty !== null && details.physical_qty !== undefined && parseFloat(details.physical_qty) !== 0) {
              store = wh;
              break outerLoop;
            }
          }
        }

        if (!store) {
          alert("Please enter at least one physical quantity before submitting.");
          return;
        }

        // Get CSRF token
        const csrfResponse = await fetch('http://147.79.101.23/api/method/petro_station_app.custom_api.auth.regenerate_session', {
          method: 'GET',
          credentials: 'include'
        });
        const csrfData = await csrfResponse.json();
        const csrfToken = csrfData.message.csrf_token;
        document.cookie = `X-Frappe-CSRF-Token=${csrfToken}; path=/`;

        // Submit to ERPNext
        const response = await fetch('http://147.79.101.23/api/method/petro_station_app.custom_api.gas_invoice.get_grouped_current_qty.submit_stock_verification', {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            'X-Frappe-CSRF-Token': csrfToken
          },
          body: JSON.stringify({
            data: reportData,
            as_of_date: as_of_date,
            store: store
          })
        });

        const result = await response.json();

        if (response.ok) {
          alert("Submitted successfully to ERPNext.");
        } else {
          console.error(result);
          alert("Error submitting to ERPNext: " + (result.message || "Unknown error"));
        }
      } catch (err) {
        console.error(err);
        alert("Error submitting to ERPNext.");
      }
    }

    function exportExcel() {
      const table = document.querySelector("table");
      if (!table) {
        alert("No data to export.");
        return;
      }
      const wb = XLSX.utils.table_to_book(table, { sheet: "Stock" });
      XLSX.writeFile(wb, "stock_report.xlsx");
    }
  </script>
</body>
</html>
