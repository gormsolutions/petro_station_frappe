<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Customer Balances</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
            padding: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        table.dataTable thead th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Customer Balances</h2>

    <table id="customerTable" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Customer Name</th>
                <th>Balance</th>
            </tr>
        </thead>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script>
$(document).ready(function () {
    const API = "http://147.79.101.23/api/method/petro_station_app.custom_api.statement.customer_bal_gas.get_customer_outstandings";

    const table = $('#customerTable').DataTable({
        processing: true,
        serverSide: true,
        searching: true,
        searchDelay: 400,       // debounce keystrokes
        deferRender: true,      // faster DOM
        order: [[1, 'desc']],   // sort by balance desc
        pageLength: 20,
        lengthMenu: [[20, 50, 100, 500, 2500], [20, 50, 100, 500, 2500]],
        ajax: function (data, callback) {
            const params = new URLSearchParams({
                limit_start: data.start,
                limit_page_length: data.length,
                search: data.search.value || '',
                // pass your filters if you use them on backend:
                // from_date: $('#from').val() || '',
                // to_date: $('#to').val() || '',
                // company: $('#company').val() || '',
                // customer_section: 'ANNEX/ELGON' // default anyway
            });

            fetch(`${API}?${params.toString()}`)
                .then(res => res.json())
                .then(json => {
                    const msg = json.message || {};
                    const customers = msg.customers || [];
                    const recordsTotal = msg.recordsTotal || 0;
                    const recordsFiltered = msg.recordsFiltered || recordsTotal;

                    callback({
                        draw: data.draw,
                        recordsTotal,
                        recordsFiltered,
                        data: customers.map(c => [c.customer_name, c.balance])
                    });
                })
                .catch(() => {
                    callback({
                        draw: data.draw,
                        recordsTotal: 0,
                        recordsFiltered: 0,
                        data: []
                    });
                });
        },
        columns: [
            { title: "Customer Name" },
            {
                title: "Balance",
                render: function (data, type, row) {
                    const n = Number(data || 0);
                    const formatted = n.toLocaleString();
                    return n < 0 ? `<span style="color:red;">${formatted}</span>` : formatted;
                }
            }
        ],
        dom: 'Bfrtip',
        buttons: [
            {
                text: 'Export Excel',
                action: function (e, dt) {
                    // Chunked export to avoid huge single response
                    const searchValue = dt.search() || '';
                    chunkedExport('xlsx', searchValue);
                }
            },
            {
                extend: 'pdfHtml5',
                text: 'Export PDF',
                title: 'Customer Balances',
                download: 'download',
                orientation: 'portrait',
                pageSize: 'A4',
                customize: function (doc) {
                    doc.content[1].table.widths = ['*', '*'];
                },
                action: function (e, dt) {
                    const searchValue = dt.search() || '';
                    chunkedExport('pdf', searchValue);
                }
            }
        ]
    });

    // Load XLSX lazily
    $.getScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");

    // Chunked client-side export to avoid requesting 999999 rows at once
    async function chunkedExport(kind, searchValue) {
        const pageSize = 2000; // tune as needed
        let start = 0;
        let rows = [];
        let total = 0;

        // First call to get counts
        const first = await fetch(`${API}?${new URLSearchParams({
            limit_start: 0,
            limit_page_length: pageSize,
            search: searchValue
        }).toString()}`).then(r => r.json());

        const msg = first.message || {};
        const firstChunk = msg.customers || [];
        total = msg.recordsFiltered || 0;
        rows = rows.concat(firstChunk);

        // Pull remaining chunks
        while (rows.length < total) {
            start += pageSize;
            const resp = await fetch(`${API}?${new URLSearchParams({
                limit_start: start,
                limit_page_length: pageSize,
                search: searchValue
            }).toString()}`).then(r => r.json());
            rows = rows.concat((resp.message && resp.message.customers) || []);
        }

        if (kind === 'xlsx') {
            const wb = XLSX.utils.book_new();
            const ws_data = [["Customer Name", "Balance"]];
            rows.forEach(c => ws_data.push([c.customer_name, c.balance]));
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            XLSX.utils.book_append_sheet(wb, ws, "Customer Balances");
            XLSX.writeFile(wb, "Customer_Balances.xlsx");
        } else {
            // PDF via pdfMake
            const body = [["Customer Name", "Balance"]];
            rows.forEach(c => {
                const n = Number(c.balance || 0);
                body.push([
                    c.customer_name,
                    n < 0 ? { text: n.toLocaleString(), color: 'red' } : n.toLocaleString()
                ]);
            });
            const pdfMakeDoc = {
                content: [
                    { text: 'Customer Balances', style: 'header' },
                    {
                        table: { headerRows: 1, widths: ['*', '*'], body }
                    }
                ],
                styles: { header: { fontSize: 18, bold: true, marginBottom: 10 } }
            };
            pdfMake.createPdf(pdfMakeDoc).download('Customer_Balances.pdf');
        }
    }
});
</script>

</body>
</html>
